name: CI - Lint, Tests & Build

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  quality-and-test:
    name: Lint, Tests & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification du Linter (ESLint)
        run: npm run lint

      - name: Vérification des types TypeScript
        run: npm run typecheck

      - name: Exécution des tests (Media Center, Extensions, Télécommande)
        run: npm test

      - name: Build de vérification (React + Electron)
        run: npm run build
